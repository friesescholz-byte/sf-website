    :root {

    /* =========================================

    .site-header {

      background: rgba(255, 255, 255, 0.85);

    .header-container {

    }

    /* =========================================
       MAIN LAYOUT
       ========================================= */
    .main-content {
      padding-top: 140px; 
      padding-bottom: 60px;
      flex: 1;
      display: flex;
      align-items: center;

    }

    /* =========================================
       PREMIUM CARD STYLES
       ========================================= */
    .danke-card {
      width: 100%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.04), 0 0 40px rgba(109, 127, 251, 0.03);
      padding: 50px 40px;
      box-sizing: border-box;
      margin: 0 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
      transform: translateY(0);
      animation: slideUp 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .success-icon-wrapper {
      width: 96px;
      height: 96px;
      background: rgba(0, 201, 183, 0.08);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #00C9B7;
      margin-bottom: 30px;
      animation: pulseGreen 2s infinite;
    }
    .success-icon-wrapper svg {
      width: 48px;
      height: 48px;
    }

    .danke-card h1 {
      margin: 0 0 15px 0;
      font-size: clamp(2rem, 4vw, 2.5rem);
      font-weight: 800;
      color: #0f172a;
    }

    .danke-card h1 span {
      background: var(--grad-linear);
      background-size: 200%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .danke-card p {
      font-size: 1.15rem;
      color: #64748b;
      line-height: 1.65;
      margin: 0 auto 35px auto;

    @keyframes pulseGreen {
      0% { box-shadow: 0 0 0 0 rgba(0, 201, 183, 0.4); }
      70% { box-shadow: 0 0 0 18px rgba(0, 201, 183, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 201, 183, 0); }
    }

    @media (max-width: 768px) {
