    :root {

    /* =========================================

    .site-header {

      background: rgba(255, 255, 255, 0.85);

      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(200, 200, 200, 0.4);
      transition: all 0.3s ease;
    }

    .header-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-logo img {
      height: 45px;
      width: auto;
      display: block;
    }

    .back-link {
      text-decoration: none;
      color: #1a1a1a;
      font-weight: 600;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.3s ease;
    }
    
    .back-link:hover {
      color: #00C9B7;
    }

    /* =========================================
       MAIN LAYOUT
       ========================================= */
    .main-content {
      padding-top: 140px; /* Space from header */
      padding-bottom: 60px;
      width: 100%;
      min-height: calc(100vh - 140px - 60px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .form-heading {
      text-align: center;
      margin-bottom: 30px;
      padding: 0 20px;
    }

    .form-heading h1 {
      margin: 0 0 10px 0;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
    }

    .form-heading h1 span {
      background: var(--grad-linear);
      background-size: 200%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-heading p {
      color: #64748b;
      font-size: 1.1rem;
      margin: 0;
      max-width: 600px;
      margin-inline: auto;
    }

    .form-wrapper { 
      width: 100%; 
      max-width: 800px; 
      height: 70vh;
      min-height: 600px;
      overflow: hidden;
    }
    
    iframe { 
      height: 100%; 
      width: 100%; 
      border: none; 
    }

    @media (max-width: 768px) {
      .main-content { padding-top: 120px; }
      .form-wrapper { height: calc(100vh - 220px); min-height: 500px; }
