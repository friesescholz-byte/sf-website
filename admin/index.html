<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>// 403 ACCESS DENIED | Scholz & Friese</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --matrix-green: #00ff66;
      --matrix-cyan: #00e5ff;
      --matrix-dark: #050b08;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--matrix-dark);
      background-image: 
        radial-gradient(circle at center, rgba(5, 15, 10, 0.4) 0%, rgba(3, 8, 5, 0.85) 100%),
        url('https://pub-b33108412309406a9a941ddc51e9a5b9.r2.dev/Scholz-Friese-Webdesign/hacker_bg.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #e6fdf0;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Matrix Rain Canvas */
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.45;
    }

    /* Subtle Scanlines effect */
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.25) 50%,
        rgba(0, 0, 0, 0.25)
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 2;
    }

    /* Content Stage (Freistehend ohne Kachel) */
    .content-stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: stageFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes stageFadeIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Central Chatbot Paper Image */
    .bot-image-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 24px;
    }

    .bot-glow-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(0, 255, 102, 0.25) 0%, rgba(0, 229, 255, 0.08) 50%, transparent 70%);
      border-radius: 50%;
      filter: blur(28px);
      z-index: 1;
    }

    .bot-image {
      position: relative;
      z-index: 2;
      width: 240px;
      height: auto;
      max-width: 90vw;
      filter: drop-shadow(0 14px 35px rgba(0, 255, 102, 0.35));
      transition: transform 0.4s ease, filter 0.4s ease;
      animation: floatBot 4s ease-in-out infinite alternate;
    }

    .bot-image:hover {
      transform: scale(1.05) rotate(-2deg);
      filter: drop-shadow(0 18px 45px rgba(0, 229, 255, 0.5));
    }

    @keyframes floatBot {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }

    /* Headline */
    h1 {
      font-size: 2.3rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #ffffff;
      margin-bottom: 32px;
      text-transform: uppercase;
      text-shadow: 
        0 0 25px rgba(0, 255, 102, 0.45),
        0 2px 10px rgba(0, 0, 0, 0.8);
    }

    /* Cyber Button */
    .btn-cyber {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(5, 11, 8, 0.7);
      border: 1.5px solid var(--matrix-green);
      color: var(--matrix-green);
      padding: 14px 34px;
      border-radius: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 
        0 0 20px rgba(0, 255, 102, 0.2),
        inset 0 0 12px rgba(0, 255, 102, 0.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-cyber::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 102, 0.25), transparent);
      transition: left 0.5s ease;
    }

    .btn-cyber:hover {
      background-color: var(--matrix-green);
      color: #030805;
      box-shadow: 0 0 35px rgba(0, 255, 102, 0.6);
      transform: translateY(-2px);
    }

    .btn-cyber:hover::before {
      left: 100%;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.65rem;
        margin-bottom: 24px;
      }
      .bot-image {
        width: 180px;
      }
      .btn-cyber {
        padding: 12px 26px;
        font-size: 0.88rem;
      }
    }
  </style>
</head>
<body>

  <!-- Background Rain Canvas -->
  <canvas id="matrix-canvas"></canvas>
  <div class="scanlines"></div>

  <!-- Freistehende Bühne -->
  <main class="content-stage">
    <!-- Bot Image -->
    <div class="bot-image-wrapper">
      <div class="bot-glow-circle"></div>
      <img 
        src="https://pub-b33108412309406a9a941ddc51e9a5b9.r2.dev/Scholz-Friese-Webdesign/chatbot_papier.png" 
        alt="Scholz & Friese Security Bot" 
        class="bot-image"
      />
    </div>

    <!-- Headline -->
    <h1>Zugriff Verweigert</h1>

    <!-- Action Button -->
    <a href="/" class="btn-cyber">
      &larr; Zurück zur Startseite
    </a>
  </main>

  <!-- Interactive Matrix Rain Script -->
  <script>
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Characters: Binary, Hex numbers and tech symbols
    const chars = '0123456789ABCDEF010101<>/{}[];:SF01';
    const fontSize = 14;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = [];

    function initDrops() {
      columns = Math.floor(canvas.width / fontSize);
      drops = [];
      for (let i = 0; i < columns; i++) {
        drops[i] = Math.floor(Math.random() * -50);
      }
    }
    initDrops();
    window.addEventListener('resize', initDrops);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(5, 11, 8, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = fontSize + 'px "JetBrains Mono", monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        
        if (Math.random() > 0.85) {
          ctx.fillStyle = '#ffffff';
        } else if (Math.random() > 0.6) {
          ctx.fillStyle = '#00e5ff';
        } else {
          ctx.fillStyle = '#00ff66';
        }

        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(drawMatrix, 40);
  </script>
</body>
</html>
